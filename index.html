<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sonde PWA VS1</title>
<meta name="theme-color" content="#0e6f63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{color-scheme:light;--bg:#f2f5f4;--surface:#fff;--ink:#17212b;--muted:#5a6873;--line:#d6dfdc;--accent:#0e6f63;--accent-ink:#fff;
--ok:#1f7a3f;--ok-bg:#e1f2e6;--warn:#8a5a00;--warn-bg:#fbefd4;--fail:#a52a2a;--fail-bg:#f8e0e0;--info:#35536b;--info-bg:#e3ecf3}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#12181c;--surface:#1a2227;--ink:#e3eae8;--muted:#9aa8b0;--line:#2c373d;--accent:#3fb8a6;--accent-ink:#0b1513;
--ok:#7fd49a;--ok-bg:#16301f;--warn:#f0c26a;--warn-bg:#352812;--fail:#f19a9a;--fail-bg:#3a1919;--info:#9cc3e0;--info-bg:#18293a}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-size:20px;margin:0}
h2{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.ctx-class{font:600 22px/1.2 ui-monospace,"SFMono-Regular",Menlo,monospace;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface)}
.ctx-class.auth{border-color:var(--accent)} .ctx-class.diag{border-color:var(--warn)}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.actions{display:flex;flex-wrap:wrap;gap:10px}
button{font:inherit;font-weight:500;border-radius:8px;padding:12px 16px;min-height:48px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.5;cursor:default} button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.status{color:var(--muted);font-size:14px;min-height:1.5em}
.box{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:8px 12px;border-bottom:1px solid var(--line)}
tr:last-child th,tr:last-child td{border-bottom:0}
th{font-weight:500;color:var(--muted);width:42%}
td{font-variant-numeric:tabular-nums;word-break:break-word}
.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:12.5px}
.pill{display:inline-block;font:600 12px/1.6 ui-monospace,Menlo,monospace;padding:0 8px;border-radius:999px;background:var(--info-bg);color:var(--info)}
.pill.PASS,.pill.YES,.pill.GREEN,.pill.PERSISTENT{background:var(--ok-bg);color:var(--ok)}
.pill.FAIL,.pill.NO,.pill.RED{background:var(--fail-bg);color:var(--fail)}
.pill.WARN,.pill.PENDING,.pill.INCOMPLETE,.pill.BEST_EFFORT,.pill.DIAGNOSTIC_ONLY{background:var(--warn-bg);color:var(--warn)}
pre{margin:0;padding:12px;font:12px/1.45 ui-monospace,Menlo,monospace;max-height:360px;overflow:auto}
p.note{font-size:13px;color:var(--muted);margin:0;max-width:65ch}
</style>
</head>
<body>
<div class="wrap">
  <h1>Sonde PWA VS1 · v2.0.0</h1>
  <section>
    <h2>Contexte d'exécution</h2>
    <div id="ctx-class" class="ctx-class">…</div>
    <p class="sub" id="ctx-authority">Lecture du contexte…</p>
  </section>
  <div class="box"><table><tbody id="ctx"></tbody></table></div>
  <div class="actions">
    <button class="primary" id="run" disabled>Lancer les tests</button>
    <button id="copy" disabled>Copier le rapport JSON</button>
    <button id="prep" disabled>Préparer le test hors ligne</button>
  </div>
  <div class="status" id="status" role="status" aria-live="polite">Démarrage…</div>
  <p class="note" id="offline-msg"></p>
  <section><h2>Verdict stockage (règles du micro-gate)</h2><div class="box"><table><tbody id="verdict"></tbody></table></div></section>
  <section><h2>Stockage</h2><div class="box"><table><tbody id="storage"></tbody></table></div></section>
  <section><h2>Service worker et hors ligne</h2><div class="box"><table><tbody id="sw"></tbody></table></div></section>
  <section><h2>Audio</h2><div class="box"><table><tbody id="audio"></tbody></table></div></section>
  <section><h2>Rapport JSON brut</h2><div class="box"><pre id="json"></pre></div></section>
  <div class="actions"><button id="reset">Effacer les données de la sonde</button></div>
</div>
<script src="probe.js"></script>
</body>
</html>
